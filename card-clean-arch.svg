<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" width="400" height="214" role="img" aria-label="Clean Architecture Template"><style>.m{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}.s{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{50%{transform:translateX(6px)}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter><clipPath id="c"><rect width="400" height="214" rx="18"/></clipPath></defs><g clip-path="url(#c)"><rect width="400" height="214" fill="#0d1020"/><circle cx="340" cy="30" r="70" fill="#a855f7" opacity=".35" filter="url(#b)"><animate attributeName="cx" values="340;280;340" dur="8s" repeatCount="indefinite"/></circle><circle cx="40" cy="200" r="60" fill="#ff4d8d" opacity=".22" filter="url(#b)"/></g><rect x="1.5" y="1.5" width="397" height="211" rx="17" fill="none" stroke="#252a55"/><rect x="1.5" y="1.5" width="397" height="211" rx="17" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite"/></rect><text class="m" x="374" y="52" text-anchor="end" font-size="34" font-weight="800" fill="#fff" fill-opacity=".07">02</text><text class="s" x="26" y="52" font-size="23" font-weight="800" fill="#fff">Clean Architecture Template</text><text class="s" x="26" y="82" font-size="13" fill="#aab3d6">A clean starting point for .NET back-ends:</text><text class="s" x="26" y="102" font-size="13" fill="#aab3d6">Domain, Application, Persistence and API</text><text class="s" x="26" y="122" font-size="13" fill="#aab3d6">layers, CQRS via MediatR, ready to build on.</text><rect x="26" y="148" width="91" he